{{- if .Values.route.enabled }}
# Gateway API route: everything not matched by a more specific route (e.g. /api/auth) -> web-ui.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.route.pathPrefix }}
      backendRefs:
        - name: {{ .Values.name }}
          port: {{ .Values.port }}
{{- end }}
