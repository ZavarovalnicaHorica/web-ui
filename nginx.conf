server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Angular routes (/claims, /reviews, ...) all load index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build files never change, so cache them for a long time.
  location ~* \.(js|css|ico|png|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # /api/* is routed to the services by the Kubernetes Ingress, not by this container.
}
