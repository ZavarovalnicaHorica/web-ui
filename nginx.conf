server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # App routes (/my/claims, /reviews, ...) all load index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed build files never change, so cache them for a long time.
  location ~* \.(js|css|ico|png|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # /api/* goes to the YARP API Gateway, not to this container.
}
